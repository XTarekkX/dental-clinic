spring:
  application:
    name: clinic

  config:
    import: optional:file:./.env.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental_clinic}
    username: ${DB_USERNAME:abdelrahmanfahmy}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/public.pem
          private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:./config/keys/private.pem}

server:
  port: ${PORT:8080}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
  jwt:
    access-token-expiration: 900000
    session-refresh-token-expiration: 86400000
    refresh-token-expiration: 604800000
  file:
    upload-dir: uploads/xrays
    max-size-mb: 10
    allowed-types: image/jpeg,image/png,image/webp,application/dicom

logging:
  level:
    root: INFO
    com.example.clinic: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
